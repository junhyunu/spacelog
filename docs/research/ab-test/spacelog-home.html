<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>spaceLog · 홈 목록 (비교 테스트용)</title>
<link rel="icon" href="data:,">
<!-- 비교 테스트용 정적 화면. 서버 없이 이 파일 하나로 돈다. 데이터는 아래 스크립트의 가짜 기록 11개 · 행성 7개.
     색 · 서체 · 모양은 앱의 web/src/styles/tokens.css와 같은 값을 쓴다. 새로고침하면 처음 상태로 돌아간다. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --ink:#1a1430; --space:#15103a; --panel:#f4f2ff; --panel-2:#e6e2ff; --mute:#5b5480; --white:#fff;
  --yellow:#ffd23f; --pink:#ff5d8f; --violet:#7a6cff; --sky:#5ec8ff; --danger-text:#c2185b; --hair:#d6d1f2;
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --line:3px; --line-thin:2.5px; --r-card:16px;
  --top-h:76px;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html{scroll-padding-top:calc(var(--top-h) + 12px)}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse 90% 620px at 50% 180px,#2c2070 0%,var(--space) 70%) var(--space);color:var(--panel);font-family:var(--f-body)}
.stars{position:absolute;inset:0 0 auto 0;height:100%;pointer-events:none;overflow:hidden}
.stars i{position:absolute;border-radius:50%;opacity:.85}
.card{background:var(--panel);color:var(--ink);border:var(--line) solid var(--ink);border-radius:var(--r-card);box-shadow:0 5px 0 var(--ink)}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-display);font-size:15px;letter-spacing:.02em;border:var(--line) solid var(--ink);border-radius:12px;background:var(--yellow);color:var(--ink);padding:8px 14px;min-height:44px;box-shadow:0 4px 0 var(--ink);cursor:pointer;white-space:nowrap;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--panel-2)}
.btn.violet{background:var(--violet);color:var(--white)}
.btn.pink{background:var(--pink);color:var(--white)}
.btn.sm{font-size:13px;padding:6px 10px;min-height:38px;gap:6px}
.btn.sq{width:46px;height:46px;padding:0}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
svg.i{flex:none}

/* ---------- 고정 상단 바 ---------- */
#top{position:sticky;top:0;z-index:20;transition:background .15s,box-shadow .15s}
#top.stuck{background:rgba(21,16,58,.94);box-shadow:0 3px 0 var(--ink)}
#top .in{max-width:1240px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px}
.logo{font-family:var(--f-display);font-size:24px;line-height:1;padding:8px 14px}
.logo span{color:var(--violet)}
#sideOpen > span{color:var(--ink)} #sideOpen > span > span{color:var(--violet)}
#top .acts{margin-left:auto;display:flex;align-items:center;gap:12px}

/* ---------- 블랙홀(로그인 후에는 작게: 목록이 첫 화면에 걸친다) ---------- */
.wrap{position:relative;max-width:1240px;margin:0 auto;padding:0 16px 88px}
.hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding-bottom:22px}
.hero h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(24px,3.4vw,34px);line-height:1.15;text-shadow:0 3px 0 var(--ink);text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--yellow)}
.hstats{display:flex;gap:8px;align-items:center;font-weight:700;font-size:13px}
.hstats b{background:var(--ink);color:var(--yellow);border-radius:999px;padding:2px 9px;border:2px solid #3a2f6a;font-variant-numeric:tabular-nums}
.bh{position:relative;width:210px;height:210px;display:grid;place-items:center;margin:-4px 0}
.bh canvas{position:absolute;inset:0;width:100%;height:100%}
.bh .btn{font-size:16px;box-shadow:0 5px 0 var(--ink)}
.hero .hint{margin:0;font-size:13px;color:#b9b3e6}

/* ---------- 본문: 왼쪽 패널 + 별 목록 ---------- */
/* 서랍 머리 · 로고 펼치기 버튼: 좁은 화면에서만 보인다 */
#sideOpen,#sideScrim{display:none}
.sd-head{display:none;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 2px 16px}
.sd-logo{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1}
.sd-logo span{color:var(--violet)}
.lay{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px;align-items:start}
#side{position:sticky;top:calc(var(--top-h) + 12px);max-height:calc(100vh - var(--top-h) - 28px);display:flex;flex-direction:column;overflow:hidden}
#side .sd-title{margin:0;padding:14px 16px 0;font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.2}
.xbtn{width:34px;height:34px;min-height:0;padding:0;box-shadow:0 3px 0 var(--ink)}
#side .stats{padding:6px 16px 14px;font-size:12.5px;font-weight:700;line-height:1.8}
#side .stats b{display:inline-block;margin:0 2px 0 4px;background:var(--ink);color:var(--yellow);border-radius:999px;padding:1px 8px;font-family:var(--f-display);font-weight:400;font-size:12px;line-height:1.35;font-variant-numeric:tabular-nums}
#side .sd-planets{min-height:0;display:flex;flex-direction:column;gap:8px;padding:14px 16px 16px;border-top:var(--line) solid var(--ink)}
.label{font-family:var(--f-display);font-size:12px;color:var(--violet);letter-spacing:.06em}
.dock{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:0;padding:2px 2px 6px;margin:0 -2px}
.dock button,#newPlanet{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;font:600 14px var(--f-body);color:var(--ink);background:var(--panel);border:var(--line) solid var(--ink);border-radius:14px;padding:7px 12px 7px 8px;box-shadow:0 4px 0 var(--ink);cursor:pointer;text-align:left;white-space:nowrap}
.dock button .dot,#newPlanet .dot{width:22px;height:22px;border-radius:50%;border:var(--line) solid var(--ink);flex:none;display:grid;place-items:center}
.dock button .t{min-width:0;overflow:hidden;text-overflow:ellipsis}
.dock button .n{margin-left:auto;font-family:var(--f-display);font-size:13px;background:var(--ink);color:var(--yellow);border-radius:999px;padding:1px 8px;font-variant-numeric:tabular-nums}
.dock button[aria-pressed="true"]{background:var(--yellow)}
.dock button.zero .t{color:var(--mute)}
#newPlanet{flex:none;background:color-mix(in srgb,var(--panel-2) 60%,var(--white));border:var(--line-thin) dashed var(--ink);box-shadow:none}
#newPlanet .dot{border:0}

/* 기간 바 · 보기 방식: 앱의 #period .pbar · .seg와 같은 값 */
.pbar{padding:5px;display:flex;gap:6px;row-gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:100%}
#period{flex:none;max-width:100%}
.seg{display:flex;gap:4px}
.seg button{position:relative;font:700 13px var(--f-body);border:0;border-radius:999px;padding:6px 12px;background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap}
.seg button::after{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%)}
.seg button:hover{background:var(--panel-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--yellow)}
.seg button:focus-visible{outline-offset:1px}
.range{display:flex;gap:4px;align-items:center;font-size:12px;padding-right:4px;color:var(--ink)}
.range input{font:500 12px var(--f-mono);height:44px;margin:-9px 0;border:solid transparent;border-width:9px 0;border-radius:8px/17px;background:var(--white) padding-box;box-shadow:inset 0 0 0 2px var(--ink);padding:3px 7px;color:var(--ink);color-scheme:light}

/* 행성별로 묶기 스위치 */
#swBox{display:flex;align-items:center;padding:0 4px}
.gsw{display:flex;align-items:center;gap:8px;min-height:44px;padding:5px 10px 5px 6px;border:0;background:transparent;color:var(--ink);font:700 13px var(--f-body);cursor:pointer;white-space:nowrap;border-radius:12px}
.gsw:hover{background:var(--panel-2)}
.gsw .star{flex:none;margin-right:-3px}
.gsw[aria-checked="true"] .star{fill:var(--yellow)}
/* 두 스위치가 다 보일 때만 사이에 세로 줄 */
#groupSw:not([hidden]) + #favSw{position:relative;margin-left:9px}
#groupSw:not([hidden]) + #favSw::before{content:"";position:absolute;left:-6px;top:10px;bottom:10px;border-left:1.5px solid var(--hair)}
.gsw .track{width:40px;height:24px;border-radius:999px;border:var(--line-thin) solid var(--ink);background:var(--panel-2);display:flex;align-items:center;padding:2px;transition:background .12s}
.gsw .knob{width:15px;height:15px;border-radius:50%;background:var(--ink);transition:transform .12s}
.gsw[aria-checked="true"] .track{background:var(--yellow)}
.gsw[aria-checked="true"] .knob{transform:translateX(16px)}

/* 목록 머리 */
.lhead{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:12px}
/* 스위치 덩어리 · 기간 바: 같은 높이(50px = 44px 줄 + 테두리 3px × 2) */
#swBox,#period{min-height:50px}
#swBox{flex:none}
/* 행성 버튼 · 시계 버튼: 좁은 화면에서만 보인다 */
.fbtn{display:none;align-items:center;gap:8px;min-height:50px;padding:0 12px;font:700 14px var(--f-body);color:var(--ink);cursor:pointer;white-space:nowrap}
.fbtn:hover{background:var(--panel-2)}
.fbtn .dot{width:16px;height:16px;border-radius:50%;border:var(--line-thin) solid var(--ink);flex:none;display:grid;place-items:center;background:var(--white)}
.fbtn .t{min-width:0;overflow:hidden;text-overflow:ellipsis}
.fbtn.sq{width:50px;padding:0;justify-content:center}
/* 시계: 기간이 '전체'가 아니면 오른쪽 위에 핑크 점(테두리 없이 살짝 투명: 시계 아이콘이 가려지지 않게) */
#periodBtn{position:relative}
#periodBtn.narrowed::after{content:"";position:absolute;top:7px;right:7px;width:10px;height:10px;border-radius:50%;background:var(--pink);opacity:.7}
.fbtn[aria-expanded="true"]{background:var(--yellow)}
/* 상세를 보는 동안(검색 · 스위치가 숨는다) 기간 바는 오른쪽 끝 */
.lhead:has(#searchBox[hidden]) #period{margin-left:auto}
/* 검색: 거르기 줄 맨 왼쪽(스위치 · 기간 바와 같은 높이 50px). 남는 폭을 다 쓰고, 기간 바가 늘어나면 160px까지 줄어든다 */
#searchBox{flex:1 1 160px;min-width:160px;display:flex;align-items:center;gap:8px;min-height:50px;padding:0 6px 0 14px}
#searchBox:focus-within{outline:3px solid var(--sky);outline-offset:2px}
#q{flex:1;min-width:0;height:44px;border:0;background:transparent;color:var(--ink);font:600 15px var(--f-body);outline:0}
#q::placeholder{color:var(--mute);font-weight:500}
#q::-webkit-search-cancel-button{display:none}
.qx{flex:none;width:36px;height:36px;border:0;border-radius:50%;background:var(--panel-2);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.qx:hover{background:var(--hair)}
mark{background:var(--yellow);color:inherit;border-radius:3px;padding:0 1px}
/* 메모에서 찾았을 때: 찾은 낱말 둘레의 메모 한 줄(좁은 화면은 메모 열이 숨어 제목 아래에 보인다) */
.ttl .snip{font-size:12.5px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (min-width:901px){.ttl .snip.memo-hit{display:none}} /* 넓은 화면은 메모 열에 이미 보인다 */
.qmore{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin:0;padding:2px 4px 8px;font-size:13px;color:var(--mute)}
.qmore button{border:0;background:transparent;padding:6px 2px;min-height:36px;color:var(--ink);font:700 13px var(--f-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
/* 목록 카드 맨 위 개수 */
.tcount{margin:0;padding:14px 4px 2px;font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.2;color:var(--ink)}

/* 별 목록: 바깥 카드만 굵은 테두리, 행 사이는 얇은 선 */
#table{padding:4px 16px 8px;overflow:hidden}
.row{display:grid;grid-template-columns:36px minmax(0,1fr) 170px minmax(0,.75fr) 84px;align-items:center;gap:12px;padding:10px 4px;border-top:1.5px solid var(--hair);min-height:64px}
.row.th{min-height:0;padding:12px 4px 10px;border-top:0;font-size:12px;font-weight:700;color:var(--mute)}
.ttl{display:flex;align-items:center;gap:12px;min-width:0;border:0;background:transparent;padding:4px;margin:-4px;border-radius:10px;color:var(--ink);cursor:pointer;text-align:left;font-family:var(--f-body)}
.ttl:hover .n{text-decoration:underline;text-underline-offset:3px}
.ttl .ic{width:38px;height:38px;border-radius:10px;border:var(--line-thin) solid var(--ink);background:var(--white);display:grid;place-items:center;flex:none}
.ttl .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.ttl .n{font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl .k{font-size:12.5px;font-weight:500;color:var(--mute)}
.pl{display:flex;align-items:center;gap:6px;min-width:0;font-size:13.5px;font-weight:600}
.pl .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);flex:none}
.pl .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav{flex:none;width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:#a9a3cc;cursor:pointer;display:grid;place-items:center}
.fav:hover{background:var(--panel-2)}
.fav[aria-pressed="true"]{color:var(--ink)}
.fav[aria-pressed="true"] svg{fill:var(--yellow)}
.dt{font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
/* 메모 열: 메모 첫 줄만 흐리게. 메모가 없으면 비워 둔다 */
/* 자주 찾음만 보는 중에 별표를 끈 행: 바로 빼지 않고 흐리게 남긴다(잘못 눌렀으면 다시 켜면 된다) */
.row.dim > :not(.c-fav){opacity:.45}
.memo{min-width:0;font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row > .c-dt{text-align:right}
.grp{display:flex;align-items:center;gap:8px;padding:16px 4px 8px;font-family:var(--f-display);font-size:15px}
.grp .dot{width:16px;height:16px;border-radius:50%;border:var(--line-thin) solid var(--ink)}
.grp .n{font-size:12px;background:var(--ink);color:var(--yellow);border-radius:999px;padding:1px 8px}
.grp + .row{border-top:var(--line-thin) solid var(--ink)}
.empty{padding:40px 16px;text-align:center}
.empty b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px;margin-bottom:6px}
.empty p{margin:0 0 14px;font-size:13.5px;line-height:1.6;color:var(--mute)}

/* ---------- 별 상세(오른쪽에서 열린다) ---------- */
/* ---------- 별 상세: 목록 자리에 펼쳐진다(저쪽 시안과 같은 구조) ---------- */
#detail{padding:14px 18px 18px;display:flex;flex-direction:column;gap:14px}
.dtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pager{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pager .btn{width:40px;height:40px;min-height:0;padding:0}
.pager .btn:disabled{opacity:.35;cursor:default;transform:none;box-shadow:0 4px 0 var(--ink)}
.pager span{min-width:52px;text-align:center}
.pvw{display:flex;flex-direction:column;align-items:center;gap:6px;padding:28px 16px;border-radius:12px;background:var(--panel-2);border:var(--line-thin) solid var(--ink);text-align:center}
.pvw .ic{width:60px;height:60px;border-radius:14px;border:var(--line) solid var(--ink);background:var(--white);display:grid;place-items:center;margin-bottom:4px}
.pvw b{font-size:16px;overflow-wrap:anywhere}
.pvw small{font-size:13px;color:var(--mute)}
#detail h3{margin:2px 0 0;font-family:var(--f-display);font-weight:400;font-size:24px;line-height:1.25;overflow-wrap:anywhere}
.dmeta{margin:-8px 0 0;font-size:13.5px;color:var(--mute)}
.dacts{display:flex;flex-wrap:wrap;gap:10px}
.fld .lblrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.fld .lblrow small{font-size:12px;color:var(--mute)}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.notes li{background:var(--white);border:1.5px solid var(--hair);border-radius:10px;padding:8px 10px;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.notes time{display:block;margin-top:2px;font-size:11.5px;color:var(--mute)}
.nsave{align-self:flex-end}
.nsave:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 4px 0 var(--ink)}
.pmove{position:relative;align-self:flex-start;display:flex;align-items:center;gap:8px;min-height:46px;padding:0 14px;border:var(--line-thin) solid var(--ink);border-radius:999px;background:var(--white);font-size:14.5px;max-width:100%}
.pmove .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);flex:none}
.pmove b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pmove .mv{font-size:12.5px;color:var(--mute);font-weight:600}
.pmove select{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer}
.pmove:has(select:focus-visible){outline:3px solid var(--sky);outline-offset:2px}
.dhint{margin:-6px 0 0;font-size:12.5px;color:var(--mute)}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld .lbl{font-size:13px;font-weight:700}
.fld :is(input,textarea,select){font:500 14px/1.55 var(--f-body);border:var(--line-thin) solid var(--ink);border-radius:10px;padding:8px 10px;min-height:44px;background:var(--white);color:var(--ink);width:100%;color-scheme:light}
.fld textarea{resize:vertical}
.fld small{font-size:12px;color:var(--mute)}
.linkdel{align-self:flex-end;min-height:44px;border:0;background:transparent;color:var(--danger-text);font:700 13px var(--f-body);text-decoration:underline;text-underline-offset:3px;cursor:pointer}

/* ---------- 창 · 토스트 ---------- */
#modal{position:fixed;inset:0;z-index:40;background:rgba(10,6,30,.6);display:grid;place-items:center;padding:16px}
#modal form{width:min(420px,100%);max-height:100%;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
#modal h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.3}
#modal p{margin:0;font-size:14px;line-height:1.6;color:var(--mute)}
#modal .rowb{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.sws{display:flex;flex-wrap:wrap;gap:4px}
.sws label{width:44px;height:44px;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.sws input{position:absolute;opacity:0}
.sws span{width:28px;height:28px;border-radius:50%;border:2px solid var(--ink)}
.sws input:checked + span{border-width:3px;box-shadow:0 0 0 3px var(--panel),0 0 0 6px var(--sky)}
.sws input:focus-visible + span{outline:3px solid var(--sky);outline-offset:6px}
/* 챗봇 버튼(앱 chat.css의 #chatBtn과 같은 값) */
#chatBtn{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;width:130px;height:46px;padding:0 14px 0 4px;margin:0;border:3px solid var(--ink);border-radius:999px;background:#a99fff;color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer;display:flex;align-items:center;gap:8px;font:800 16px var(--f-body);white-space:nowrap;transition:transform .08s,box-shadow .08s}
#chatBtn:hover{transform:translateY(-1px)}
#chatBtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
#chatBtn .atom{flex:none;display:block}
#chatBtn .t{flex:1;min-width:0;text-align:center}
#chatBtn .orbits{transform-box:view-box;transform-origin:32px 32px;animation:chat-orbit 20s linear infinite}
#chatBtn .o-ink{fill:none;stroke:var(--ink);stroke-width:5.8}
#chatBtn .o-white{fill:none;stroke:var(--white);stroke-width:2.6}
@keyframes chat-orbit{to{transform:rotate(1turn)}}
/* 상세 미리보기의 본문 앞부분 */
.pvw .pbody{margin:8px 0 0;max-width:520px;max-height:6.4em;overflow:hidden;font-size:13px;line-height:1.6;color:var(--ink);white-space:pre-line;text-align:left}
/* 챗봇 버튼: 열리면 원자 대신 ✕, 글자는 "닫기" */
#chatBtn .x{display:none;width:32px;height:32px;place-items:center;border-radius:50%;background:#5b4fd6;color:var(--white)}
#chatBtn[aria-expanded="true"] .atom{display:none}
#chatBtn[aria-expanded="true"] .x{display:grid}
/* 챗봇 창 */
@keyframes pop{from{transform:scale(.96);opacity:0}}
/* 넓은 화면(1100px 이상): 챗봇이 열리면 본문이 그만큼 왼쪽으로 비켜 나란히 보인다(앱의 행성 패널과 같은 규칙) */
/* 챗봇 창 자리(380px + 양쪽 간격 26px)를 뺀 폭 안에서 본문을 가운데 둔다 */
@media (min-width:1100px){body.chat-open .wrap{margin-left:max(0px,calc((100vw - 406px - 1240px) / 2));margin-right:406px}}
#chatPanel{position:fixed;right:14px;bottom:calc(16px + 46px + 14px + env(safe-area-inset-bottom,0px));z-index:24;width:min(380px,calc(100vw - 28px));height:min(600px,75vh);display:flex;flex-direction:column;overflow:hidden;animation:pop .22s cubic-bezier(.3,1.5,.6,1);transform-origin:100% 100%}
.cp-head{flex:none;display:flex;align-items:center;gap:8px;min-height:58px;padding:8px 14px;border-bottom:var(--line) solid var(--ink)}
.cp-head h2{margin:0;flex:1;font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.2}
.cp-head .x{width:36px;height:36px;min-height:0;padding:0;box-shadow:0 3px 0 var(--ink)}
.ct-msgs{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;margin:0;padding:14px;list-style:none;display:flex;flex-direction:column;gap:10px}
.ct-msgs:focus-visible{outline-offset:-4px}
.cp-home{display:flex;flex-direction:column;gap:10px}
.cp-hi{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;line-height:1.25}
.cp-sub{margin:0;font-size:12.5px;line-height:1.6;color:var(--mute)}
.cp-quick{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.cp-quick .btn{justify-content:flex-start;text-align:left;white-space:normal;font:700 14px var(--f-body);min-height:44px;box-shadow:0 3px 0 var(--ink)}
.b{max-width:88%;border:var(--line-thin) solid var(--ink);border-radius:14px;padding:8px 12px;font:500 14px/1.6 var(--f-body);color:var(--ink)}
.b.user{align-self:flex-end;background:var(--yellow);border-bottom-right-radius:4px}
.b.bot{align-self:flex-start;background:var(--white);border-bottom-left-radius:4px;max-width:94%}
.b .tx{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.b.wait .tx{color:var(--mute)}
.b.wait .tx::after{content:"…";animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.srcs{margin-top:10px;padding-top:8px;border-top:1.5px dashed #c9c2ec}
.srclbl{margin:0 0 2px;font:700 11.5px var(--f-body);color:var(--mute)}
.srcs ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.src{display:flex;align-items:center;gap:7px;width:100%;min-height:36px;padding:0 2px;border:0;border-radius:6px;background:transparent;color:var(--ink);font:600 13px var(--f-body);text-align:left;cursor:pointer}
.src:hover{background:var(--panel)}
.src .pdot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);flex:none}
.src .t{min-width:0;padding-block:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:underline;text-decoration-color:var(--mute);text-decoration-thickness:1.5px;text-underline-offset:3px}
.src small{flex:none;margin-left:auto;font-size:11px;color:var(--mute)}
.src.gone{color:var(--mute);cursor:default}
.src.gone .t{text-decoration:none}
.bacts{margin-top:10px;display:flex;justify-content:flex-end}
.bacts .btn{font:700 12.5px var(--f-body);min-height:32px;padding:5px 10px;box-shadow:none;background:var(--white);border-width:2px;gap:5px}
.bacts .btn:hover{background:var(--panel-2)}
.ct-form{flex:none;padding:10px 12px 12px;border-top:var(--line) solid var(--ink)}
.ct-box{position:relative}
.ct-ta{display:block;width:100%;min-height:48px;max-height:112px;resize:none;border:var(--line-thin) solid var(--ink);border-radius:14px;padding:11px 52px 11px 14px;background:var(--white);color:var(--ink);font:500 14px/1.5 var(--f-body)}
.ct-go{position:absolute;right:7px;bottom:7px;width:34px;height:34px;padding:0;display:grid;place-items:center;border:2.5px solid var(--ink);border-radius:50%;background:var(--yellow);color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--ink)}
.ct-go:disabled{background:var(--panel-2);color:var(--mute);border-color:var(--mute);box-shadow:none;cursor:default}
.ct-go::after{content:"";position:absolute;inset:-5px}
#veil{position:fixed;inset:0;z-index:100;background:var(--ink)}
#toast{position:fixed;z-index:50;left:50%;bottom:78px;transform:translateX(-50%);padding:9px 16px;background:var(--yellow);font-weight:700;font-size:14px;line-height:1.45;text-align:center;width:max-content;max-width:min(560px,92vw);pointer-events:none}

@media (max-width:900px){
  .row{grid-template-columns:36px minmax(0,1fr) 150px 84px}
  .row > .c-memo{display:none}
}
@media (max-width:760px){
  :root{--top-h:64px}
  #top .in{padding:10px;gap:6px}
  #top .acts{gap:6px;min-width:0}
  .logo{font-size:18px;padding:7px 9px}
  #top .btn{padding:6px 8px;font-size:13px}
  #top .btn.sq{width:40px;height:40px}
  #top .btn .i.opt,#topEnter .lt{display:none}
  .bh{width:180px;height:180px}
  /* 블랙홀 부분: 위 상단 바와 아래 검색 줄에서 각각 32px 띄운다 */
  .hero{padding-top:32px;padding-bottom:32px}
  .lay{grid-template-columns:minmax(0,1fr)}
  /* 좁은 화면: 왼쪽 패널은 우주처럼 왼쪽에서 덮이는 서랍. 상단 로고(+ 펼치기 아이콘)를 눌러 열고,
     접기 아이콘 · 바깥(#sideScrim) · Esc · 행성 고르기로 닫는다 */
  #top .logo:not(#sideOpen){display:none}
  #sideOpen{display:flex;align-items:center;gap:6px;min-height:40px;padding:6px 8px 6px 10px;cursor:pointer;color:var(--ink)}
  #side{display:none}
  body.side-open #side{display:flex;position:fixed;top:0;bottom:0;left:0;z-index:35;width:min(300px,calc(100vw - 48px));max-height:none;border-left:0;border-radius:0 var(--r-card) var(--r-card) 0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:drawer .2s ease-out}
  @keyframes drawer{from{transform:translateX(-100%)}}
  #sideScrim{display:block;position:fixed;inset:0;z-index:34;background:rgba(10,6,30,.6)}
  #side .sd-head{display:flex}
  #side .sd-planets{flex:1}
  /* 검색은 거르기 줄 맨 위에 꽉 찬 한 줄 */
  #searchBox{flex-basis:100%}
  /* 거르기 줄: [지금 행성] [행성별 · 별표] [시계]. 기간 바는 시계를 눌렀을 때만 아래 줄에 */
  .lhead{gap:8px}
  .fbtn{display:flex}
  /* 행성 버튼은 남는 폭만 쓴다(시계가 다음 줄로 밀리지 않게, 긴 이름은 …) */
  #planetBtn{flex:1 1 0;min-width:0;padding:0 8px 0 10px;gap:6px}
  #swBox{padding:0 2px}
  .gsw{gap:6px;padding:5px 6px 5px 4px}
  .gsw .track{width:36px;height:22px}
  .gsw .knob{width:13px;height:13px}
  .gsw[aria-checked="true"] .knob{transform:translateX(14px)}
  #planetBtn .i{margin-left:auto;flex:none}
  .lhead:not(.p-open) #period{display:none}
  /* 상세를 보는 동안: 행성 버튼은 숨고, 시계는 오른쪽 끝 */
  .lhead:has(#searchBox[hidden]) #periodBtn{margin-left:auto}
  #period{margin-left:0;width:100%;justify-content:stretch}
  #period .seg{flex:1 1 100%}
  #period .seg button{flex:1;text-align:center;padding:6px 7px}
  #period .range{flex:1 1 100%;padding:0 4px}
  #period .range input{flex:1;min-width:0}
  #table{padding:2px 10px 6px}
  .row{grid-template-columns:36px minmax(0,1fr);gap:8px}
  .row > :is(.c-dt,.c-pl){display:none}
  #detail{padding:12px 12px 16px}
  .pvw{padding:20px 12px}
}
@media (max-width:760px){
  /* 좁은 화면: 챗봇 창은 화면 전체(앱과 같다), 닫기는 머리의 ✕ */
  #chatPanel{inset:0;width:auto;height:auto;border:0;border-radius:0;box-shadow:none;animation:none;z-index:45}
  #chatBtn{width:46px;padding:0 0 0 4px;gap:0}
  #chatBtn .t{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</head>
<body>
<div class="stars" id="stars" aria-hidden="true"></div>

<header id="top">
  <div class="in">
    <div class="logo card">space<span>Log</span></div>
    <!-- 좁은 화면(760px 이하): 로고 + 펼치기 아이콘(우주의 #sideOpen과 같은 모양). 누르면 왼쪽에서 행성 서랍이 펼쳐진다 -->
    <button type="button" id="sideOpen" class="logo card" aria-label="행성 고르기 펼치기" aria-expanded="false" aria-controls="side"><span>space<span>Log</span></span><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/></svg></button>
    <div class="acts">
      <!-- 블랙홀이 화면 밖으로 나가면 나타난다 -->
      <button type="button" class="btn violet" id="topEnter" data-act="enter" hidden><!-- 토성: 노란 공 + 기울어진 고리(뒤쪽 고리는 공에 가려지고 앞쪽 고리만 공 위로 지나간다) --><svg class="i" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="rotate(-20 12 12)"><ellipse cx="12" cy="12" rx="10.5" ry="3.6"/><circle cx="12" cy="12" r="6.3" fill="#ffd23f"/><path d="M1.5 12a10.5 3.6 0 0 0 21 0"/></g></svg><span class="lt">우주로 들어가기</span></button>
      <button type="button" class="btn" data-act="log"><svg class="i opt" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>기록하기</button>
      <button type="button" class="btn ghost" data-act="logout">로그아웃</button>
      <button type="button" class="btn ghost sq" data-act="me" aria-label="계정 설정" title="계정 설정"><svg class="i" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></button>
    </div>
  </div>
</header>

<div class="wrap">
  <section class="hero" aria-label="내 우주">
    <h1 id="greet"></h1>
    <div class="hstats" id="hstats"></div>
    <div class="bh"><canvas id="bhCanvas" aria-hidden="true"></canvas><button type="button" class="btn violet" id="enterBtn" data-act="enter">우주로 들어가기</button></div>
    <p class="hint">버튼을 누르면 블랙홀을 지나 내 우주로 들어가요</p>
  </section>

  <main class="lay" id="lay">
    <!-- 우주 안 왼쪽 패널과 같은 모양. 홈에서는 행성을 누르면 날아가는 대신 오른쪽 목록이 그 행성의 별만 보여 준다 -->
    <aside id="side" class="card" aria-label="행성 고르기">
      <!-- 넓은 화면은 상단 바에 로고가 있어 패널에는 두지 않고, 패널은 아무것도 가리지 않아 접지 않는다.
           좁은 화면은 우주처럼 왼쪽에서 덮이는 서랍: 머리에 로고 + 접기 아이콘(우주의 .sd-head와 같은 모양) -->
      <header class="sd-head"><b class="sd-logo" aria-hidden="true">space<span>Log</span></b><button type="button" class="btn ghost xbtn" id="sideClose" aria-label="행성 고르기 접기" aria-controls="side"><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg></button></header>
      <h2 class="sd-title" id="dockLabel">행성 고르기</h2>
      <div class="stats"><span id="sLabel"></span><b id="sRec">0</b>개 · 행성<b id="sPlanet">0</b>개</div>
      <div class="sd-planets">
        <button type="button" id="newPlanet" data-act="newPlanet"><span class="dot" aria-hidden="true"><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span>새 행성</button>
        <div class="dock" id="dock" role="group" aria-labelledby="dockLabel"></div>
      </div>
    </aside>

    <section aria-label="별 목록">
      <div class="lhead">
        <!-- 검색: 거르기 줄 맨 왼쪽. 남는 폭을 다 쓰고, 기간 바가 "직접 지정"으로 늘어나면 그만큼 줄어든다.
             지금 고른 행성 · 기간 안에서 제목 · 내용 · 메모를 찾는다 -->
        <div class="card" id="searchBox" role="search">
          <svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="q" autocomplete="off" enterkeyhint="search" placeholder="제목·내용·메모에서 찾기" aria-label="제목, 내용, 메모에서 찾기">
          <button type="button" class="qx" id="qClear" aria-label="검색어 지우기" hidden><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>
        <!-- 왼쪽에서 "전체 보기"를 골랐을 때만 보인다. 행성 하나를 고르면 묶을 것이 없어 숨는다(켜 둔 상태는 기억한다) -->
        <!-- 좁은 화면: 지금 보는 행성(색 점 + 이름). 누르면 왼쪽 행성 서랍이 열린다(로고 옆 아이콘과 같은 서랍) -->
        <button type="button" class="card fbtn" id="planetBtn" aria-controls="side" aria-expanded="false"><span class="dot" aria-hidden="true"></span><span class="t" id="planetBtnName"></span><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <div class="card" id="swBox">
          <button type="button" class="gsw" id="groupSw" role="switch" aria-checked="false" aria-label="행성별로 묶기" title="행성별로 묶기"><span class="track" aria-hidden="true"><span class="knob"></span></span>행성별</button>
          <!-- 자주 찾음만(별표 아이콘만): 행성을 골라도 남는다. 묶기 스위치가 숨으면 이 덩어리가 그만큼 줄어든다 -->
          <button type="button" class="gsw" id="favSw" role="switch" aria-checked="false" aria-label="자주 찾음만 보기" title="자주 찾음만 보기"><span class="track" aria-hidden="true"><span class="knob"></span></span><svg class="i star" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg></button>
        </div>
        <!-- 좁은 화면: 시계 아이콘. 누르면 아래에 기간 바가 펼쳐진다(전체 · 오늘 · 이번 주를 고르면 접힌다, 직접 지정은 날짜를 고르게 남는다) -->
        <button type="button" class="card fbtn sq" id="periodBtn" aria-controls="period" aria-expanded="false"><svg class="i" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></button>
        <!-- 기간 바: 우주 안 오른쪽 위의 기간 바(#period .pbar)와 같은 모양 · 같은 순서 -->
        <div class="pbar card" id="period">
          <div class="seg" id="pSeg" role="group" aria-label="기간 선택"><button type="button" data-p="all">전체</button><button type="button" data-p="today">오늘</button><button type="button" data-p="week">이번 주</button><button type="button" data-p="custom">직접 지정</button></div>
          <div class="range" id="range" hidden><input type="date" id="rFrom" aria-label="시작 날짜"><span>~</span><input type="date" id="rTo" aria-label="끝 날짜"></div>
        </div>
      </div>

      <div id="table" class="card"></div>
      <!-- 별 상세: 목록을 누르면 목록 자리에 펼쳐진다. 왼쪽 패널 · 기간 바는 그대로 -->

<!-- 우주로 들어갈 때 버튼 자리에서 퍼지는 잉크 막. 다 덮이면 universe.html로 넘어간다(그쪽은 같은 막으로 시작한다) -->

<!-- 더미 데이터 · 흉내 챗봇: 3D 우주(universe.html)와 함께 쓴다 -->
<script src="data.js"></script>
<script>
/* ================= 데이터: data.js(기록 11개 · 행성 7개)의 상태. 3D 우주와 같은 곳에 저장한다 ================= */
const T = window.SPACELOG_TEST;
if (/[?&]reset\b/.test(location.search)) T.reset(); // 주소 끝에 ?reset을 붙여 열면 처음 상태로
const NOW = new Date();
const COLORS = T.COLORS;
const shared = T.load();
let planets = shared.planets;
let stars = shared.stars.map((s) => ({ ...s, at: new Date(s.at) }));
/** 바뀐 것을 저장한다(우주로 가도 그대로 보이게). render()와 메모 · 덧붙인 기록이 부른다 */
function persist() {
  T.save({ ...T.load(), seq, planets, stars: stars.map((s) => ({ ...s, at: s.at.toISOString() })) });
}
// 뒤로 가기로 돌아왔을 때 예전 화면이 그대로 보이지 않게(우주에서 바꾼 것을 다시 읽는다)
addEventListener('pageshow', (e) => { if (e.persisted) location.reload(); });

/* ================= 상태 ================= */
const S = { planet: 'all', group: false, fav: false, period: 'today', from: '', to: '', detail: null, q: '' };
const keep = new Set(); // 자주 찾음만 보는 중에 별표를 끈 별: 다음에 거르기가 바뀔 때까지 흐리게 남긴다
let seq = shared.seq ?? 100;
let backY = 0; // 상세를 열기 전 스크롤 위치(목록으로 돌아올 때 되돌린다)

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const P = (id) => planets.find((p) => p.id === id);
const IC = {
  csv: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/>',
  text: '<polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/>',
  star: '<path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  left: '<path d="m15 18-6-6 6-6"/>',
  right: '<path d="m9 18 6-6-6-6"/>',
  back: '<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  layers: '<path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="m2 12 8.58 3.91a2 2 0 0 0 1.66 0L21 12"/><path d="m2 17 8.58 3.91a2 2 0 0 0 1.66 0L21 17"/>',
};
const ico = (n, z = 18) => `<svg class="i" width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

/* ================= 날짜 · 기간 ================= */
const day0 = (d, add = 0) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + add);
const md = (d) => `${d.getMonth() + 1}월 ${d.getDate()}일`;
const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parse = (s) => { const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; };

/** 지금 기간의 범위 { from, to(미포함), text }. 전체는 from · to가 null. */
function range() {
  const t = day0(NOW);
  if (S.period === 'today') return { from: t, to: day0(t, 1) };
  if (S.period === 'week') return { from: day0(t, -6), to: day0(t, 1) }; // 오늘 포함 최근 7일(앱과 같다)
  if (S.period === 'custom') {
    let f = parse(S.from) || t, l = parse(S.to) || f;
    if (l < f) [f, l] = [l, f];
    return { from: f, to: day0(l, 1) };
  }
  return { from: null, to: null };
}
const PERIOD_LABEL = { today: '오늘 별', week: '이번 주 별', all: '전체 별', custom: '이 기간 별' };
const inPeriod = () => { const r = range(); return stars.filter((s) => !r.from || (s.at >= r.from && s.at < r.to)); };
/* 검색: 제목 · 내용(본문) · 메모에서 찾는다(대소문자 · 앞뒤 빈칸 무시). 지금 고른 행성 · 기간 · 자주 찾음 안에서만 */
const qnorm = (t) => String(t ?? '').toLowerCase();
const qOf = () => qnorm(S.q.trim());
// 내용은 글 기록의 본문만(CSV 앞 몇 줄은 미리보기라 찾지 않는다: 3D 우주의 검색과 같게)
const bodyOf = (s) => (s.kind === 'text' ? s.body : '');
const hit = (s, q = qOf()) => !q || qnorm(s.title).includes(q) || qnorm(bodyOf(s)).includes(q) || qnorm(s.memo).includes(q);
/** 찾은 낱말을 <mark>로 감싼다(나머지는 esc). */
function markQ(text, q = qOf()) {
  text = String(text ?? '');
  if (!q) return esc(text);
  const low = qnorm(text); let out = '', i = 0, j;
  while ((j = low.indexOf(q, i)) !== -1) { out += esc(text.slice(i, j)) + `<mark>${esc(text.slice(j, j + q.length))}</mark>`; i = j + q.length; }
  return out + esc(text.slice(i));
}
/** 메모에서 찾았으면 그 낱말 둘레의 한 줄(앞을 줄여 낱말이 보이게). 없으면 null */
function memoSnip(memo, q = qOf()) {
  const m = String(memo ?? '').replace(/\s+/g, ' ').trim();
  const at = q ? qnorm(m).indexOf(q) : -1;
  if (at < 0) return null;
  const from = Math.max(0, at - 12);
  return (from ? '…' : '') + markQ(m.slice(from), q);
}
const visible = () =>
  inPeriod().filter((s) => (S.planet === 'all' || s.planet === S.planet) && (!S.fav || s.fav || keep.has(s.id)) && hit(s));
/** 거르기(행성 · 기간 · 묶기 · 자주 찾음)가 바뀔 때: 흐리게 남겨 둔 별을 이제 뺀다. */
const refilter = () => { keep.clear(); render(); };
function ago(d) {
  const n = Math.round((day0(NOW) - day0(d)) / 864e5);
  return n <= 0 ? '오늘' : n === 1 ? '어제' : `${n}일 전`;
}

/* ================= 그리기 ================= */
/** 목록에 보이는 순서 그대로(행성별로 묶으면 행성 순서 → 최신순). 상세의 1 / N도 이 순서를 쓴다. */
function ordered() {
  const list = visible().sort((a, b) => b.at - a.at);
  if (!(S.group && S.planet === 'all')) return list;
  return planets.flatMap((p) => list.filter((s) => s.planet === p.id));
}

function render() {
  persist();
  const per = inPeriod();
  const list = ordered();
  if (S.detail && !list.some((s) => s.id === S.detail)) S.detail = null; // 보던 별이 목록에서 빠지면 목록으로

  // 인사말(오늘 기준)
  const t0 = day0(NOW), todayN = stars.filter((s) => s.at >= t0).length;
  $('greet').innerHTML = stars.length === 0 ? '우주선장님, 나만의 우주를 시작해 보세요' : todayN ? `오늘 별 <em>${todayN}개</em>를 띄웠어요` : '오늘은 아직 별이 없어요';
  $('hstats').innerHTML = `<b>${stars.length}</b>개의 별 <b>${planets.length}</b>개의 행성`;

  // 왼쪽 패널
  $('sLabel').textContent = PERIOD_LABEL[S.period];
  $('sRec').textContent = per.length;
  $('sPlanet').textContent = planets.length;
  const item = (id, name, n, dot) =>
    `<button type="button" data-planet="${esc(id)}" aria-pressed="${S.planet === id}" class="${n ? '' : 'zero'}">${dot}<span class="t">${esc(name)}</span><span class="n">${n}</span></button>`;
  $('dock').innerHTML =
    item('all', '전체 보기', per.length, `<span class="dot" style="background:var(--white)">${ico('layers', 12)}</span>`) +
    planets.map((p) => item(p.id, p.name, per.filter((s) => s.planet === p.id).length, `<span class="dot" style="background:${p.color}"></span>`)).join('');

  // 기간 바
  for (const b of $('pSeg').children) b.setAttribute('aria-pressed', String(b.dataset.p === S.period));
  $('range').hidden = S.period !== 'custom';
  $('groupSw').hidden = S.planet !== 'all';
  $('swBox').hidden = Boolean(S.detail);
  // 좁은 화면의 행성 버튼 · 시계 버튼
  const cur = S.planet === 'all' ? null : P(S.planet);
  $('planetBtn').hidden = Boolean(S.detail);
  $('planetBtnName').textContent = cur ? cur.name : '전체 보기';
  $('planetBtn').querySelector('.dot').style.background = cur ? cur.color : 'var(--white)';
  $('planetBtn').querySelector('.dot').innerHTML = cur ? '' : ico('layers', 10);
  $('planetBtn').setAttribute('aria-label', `행성: ${cur ? cur.name : '전체 보기'}, 바꾸기`);
  const pName = { all: '전체', today: '오늘', week: '이번 주', custom: '직접 지정' }[S.period];
  $('periodBtn').setAttribute('aria-label', `기간: ${pName}, 바꾸기`);
  $('periodBtn').title = `기간: ${pName}`;
  $('periodBtn').classList.toggle('narrowed', S.period !== 'all');
  $('searchBox').hidden = Boolean(S.detail); // 상세를 보는 동안은 거르기와 함께 숨는다
  if ($('q').value !== S.q) $('q').value = S.q;
  $('qClear').hidden = !S.q;
  $('table').hidden = Boolean(S.detail);
  $('groupSw').setAttribute('aria-checked', String(S.group));
  $('favSw').setAttribute('aria-checked', String(S.fav));

  // 목록 머리
  const where = S.planet === 'all' ? '' : `${P(S.planet)?.name ?? ''} · `;
  const q = qOf(), shown = list.filter((s) => !S.fav || s.fav).length;
  // 검색 중: 지금 범위(행성 · 기간 · 자주 찾음) 밖에서도 맞는 별이 있으면 알려 준다
  const outside = q ? stars.filter((s) => hit(s, q)).length - list.length : 0;
  const countHtml =
    `<h2 class="tcount" aria-live="polite">${q ? `${esc(where)}‘${esc(S.q.trim())}’ 찾은 별 ${shown}개` : `${esc(where)}별 ${shown}개`}</h2>` +
    (outside > 0 && list.length ? `<p class="qmore">다른 행성·기간에 ${outside}개 더 있어요<button type="button" data-act="qAll">전체에서 찾기</button></p>` : '');
  // 목록
  const head =
    '<div class="row th"><span class="c-fav" aria-hidden="true"></span><span>제목 · 종류</span><span class="c-pl">행성</span><span class="c-memo">메모</span><span class="c-dt">넣은 날</span></div>';
  const row = (s) => {
    const p = P(s.planet);
    const kind = s.kind === 'csv' ? 'CSV' : '텍스트';
    // 제목에 없고 내용 · 메모에서 찾았으면 그 둘레 한 줄을 보여 준다(왜 나왔는지 알게)
    const snip = memoSnip(s.memo);
    const bodySnip = !snip && !qnorm(s.title).includes(qOf()) ? memoSnip(bodyOf(s)) : null;
    const memoCell = snip ?? esc(s.memo.trim().split('\n')[0]);
    return (
      `<div class="row${S.fav && !s.fav ? ' dim' : ''}" data-id="${s.id}">` +
      // 자주 찾음: 행 맨 왼쪽 고정 칸(제목 · 행성 길이와 상관없이 별이 한 세로줄에 선다)
      `<span class="c-fav"><button type="button" class="fav" data-a="fav" aria-pressed="${s.fav}" aria-label="${esc(s.title)} 자주 찾음" title="자주 찾음">${ico('star', 18)}</button></span>` +
      `<button type="button" class="ttl" data-a="open"><span class="ic">${ico(s.kind, 18)}</span><span class="tx"><span class="n">${markQ(s.title)}</span><span class="k">${kind} · ${esc(s.size)}</span>${snip ? `<span class="snip memo-hit">메모: ${snip}</span>` : bodySnip ? `<span class="snip">내용: ${bodySnip}</span>` : ''}</span></button>` +
      `<span class="pl c-pl"><span class="dot" style="background:${p?.color}"></span><span class="t">${esc(p?.name)}</span></span>` +
      `<span class="memo c-memo"${s.memo.trim() ? ` title="${esc(s.memo.trim())}"` : ''}>${memoCell}</span>` +
      `<span class="dt c-dt">${md(s.at)}</span></div>`
    );
  };
  let body;
  if (!list.length && q) {
    const elsewhere = stars.filter((s) => hit(s, q)).length;
    body =
      `<div class="empty"><b>‘${esc(S.q.trim())}’에 맞는 별이 없어요</b>` +
      (elsewhere
        ? `<p>다른 행성·기간에 ${elsewhere}개 있어요.</p><button type="button" class="btn ghost sm" data-act="qAll">전체에서 찾기</button></div>`
        : '<p>제목·내용·메모에서 찾았어요. 다른 낱말로 찾아보세요.</p><button type="button" class="btn ghost sm" data-act="qClear">검색어 지우기</button></div>');
  } else if (!list.length && S.fav) {
    body =
      '<div class="empty"><b>자주 찾음으로 표시한 별이 없어요</b><p>목록의 ☆을 눌러 표시해 보세요.</p>' +
      '<button type="button" class="btn ghost sm" data-act="favOff">자주 찾음만 끄기</button></div>';
  } else if (!list.length) {
    body =
      '<div class="empty"><b>이 기간에는 별이 없어요</b><p>기간을 넓히거나 다른 행성을 골라 보세요.</p>' +
      '<button type="button" class="btn ghost sm" data-act="resetFilter">전체 기간 · 전체 보기로</button></div>';
  } else if (S.group && S.planet === 'all') {
    body = planets
      .map((p) => [p, list.filter((s) => s.planet === p.id)])
      .filter(([, l]) => l.length)
      .map(([p, l]) => `<div class="grp"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}<span class="n">${l.length}</span></div>` + l.map(row).join(''))
      .join('');
  } else body = list.map(row).join('');
  $('table').innerHTML = countHtml + (list.length ? head : '') + body;

  renderDetail();
}

function renderDetail() {
  const el = $('detail');
  const s = stars.find((x) => x.id === S.detail);
  if (!s) { el.hidden = true; el.textContent = ''; return; }
  const list = ordered(), i = list.findIndex((x) => x.id === s.id);
  const p = P(s.planet), file = s.kind === 'csv';
  const kind = file ? 'CSV' : '텍스트';
  const hm = (d) => `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  el.innerHTML =
    '<div class="dtop">' +
    `<button type="button" class="btn ghost sm" data-d="back">${ico('back', 16)}목록으로</button>` +
    `<div class="pager"><button type="button" class="btn ghost" data-d="prev" aria-label="이전 기록"${i <= 0 ? ' disabled' : ''}>${ico('left')}</button>` +
    `<span aria-live="polite">${i + 1} / ${list.length}</span>` +
    `<button type="button" class="btn ghost" data-d="next" aria-label="다음 기록"${i >= list.length - 1 ? ' disabled' : ''}>${ico('right')}</button></div></div>` +

    `<small>${kind} · ${esc(s.size)} · ${file ? '원본은 내 PC 보관함에 있어요' : '글은 이 기록 안에 있어요'}</small>` +
    (s.body ? `<p class="pbody">${esc(s.body)}</p>` : '') + '</div>' +
    `<h3>${esc(s.title)}</h3>` +
    `<p class="dmeta">${file ? '파일' : '글'} · ${kind} · ${esc(s.size)} · ${md(s.at)} 넣음</p>` +
    (file ? '<div class="dacts"><button type="button" class="btn ghost" data-d="openFile">원본 열기</button><button type="button" class="btn ghost" data-d="folder">폴더에서 보기</button></div>' : '') +
    `<label class="fld"><span class="lblrow"><span class="lbl">메모</span><small>자동 저장</small></span><textarea rows="4" data-d="memo" placeholder="이 기록에 대한 메모를 남겨 보세요">${esc(s.memo)}</textarea></label>` +
    '<div class="fld"><span class="lbl" id="noteLbl">덧붙인 기록</span>' +
    (s.notes.length ? `<ul class="notes">${s.notes.map((n) => `<li>${esc(n.text)}<time>${md(new Date(n.at))} ${hm(new Date(n.at))}</time></li>`).join('')}</ul>` : '') +
    '<textarea rows="3" data-d="note" aria-labelledby="noteLbl" placeholder="이 기록에 생각을 덧붙여 보세요 · Enter로 저장, Shift+Enter 줄바꿈"></textarea>' +
    '<button type="button" class="btn nsave" data-d="noteSave" disabled>저장하기</button></div>' +
    '<div class="fld"><span class="lbl">행성</span>' +
    `<span class="pmove"><span class="dot" style="background:${p?.color}"></span><b>${esc(p?.name)}</b><span class="mv">옮기기</span>${ico('chev', 16)}` +
    `<select data-d="move" aria-label="행성 옮기기">${planetOptions(s.planet)}</select></span></div>` +
    '<p class="dhint">옮기면 우주에서도 기록이 그 행성으로 이동해요.</p>' +
    '<button type="button" class="linkdel" data-d="del">이 별 지우기</button>';
  el.hidden = false;
}

/** 상세 위쪽(기간 바가 있는 줄)이 고정 상단 바 바로 아래에 오게 스크롤한다. */
function scrollToDetail() {
  const y = document.querySelector('.lhead').getBoundingClientRect().top + scrollY - $('top').offsetHeight - 8;
  scrollTo({ top: Math.max(0, y) });
}
function openDetail(id) {
  if (!S.detail) backY = scrollY;
  S.detail = id; render(); scrollToDetail();
}
function closeDetail() {
  const id = S.detail;
  S.detail = null; render();
  scrollTo({ top: backY });
  $('table').querySelector(`[data-id="${id}"] .ttl`)?.focus({ preventScroll: true });
}
function stepDetail(d) {
  const list = ordered(), i = list.findIndex((x) => x.id === S.detail), n = list[i + d];
  if (!n) return;
  S.detail = n.id; render(); scrollToDetail();
  const b = $('detail').querySelector(d < 0 ? '[data-d=prev]' : '[data-d=next]');
  (b && !b.disabled ? b : $('detail').querySelector('[data-d=back]')).focus({ preventScroll: true });
}

/* ================= 창 · 토스트 ================= */
let toastT = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2600);
}
let modalBack = null;
/** 작은 창. fields는 폼 안쪽 HTML, onOk(form)이 false를 돌려주면 닫지 않는다. */
function modal({ title, desc = '', fields = '', ok = '확인', kind = '', onOk }) {
  modalBack = document.activeElement;
  const m = $('modal');
  m.innerHTML =
    `<form class="card" role="dialog" aria-modal="true" aria-label="${esc(title)}" novalidate><h3>${esc(title)}</h3>${desc ? `<p>${esc(desc)}</p>` : ''}${fields}` +
    `<div class="rowb"><button type="button" class="btn ghost" data-m="no">취소</button><button type="submit" class="btn ${kind}">${esc(ok)}</button></div></form>`;
  m.hidden = false;
  const form = m.firstChild;
  (form.querySelector('input:not([type=radio]),textarea,select') ?? form.querySelector('[data-m=no]')).focus();
  form.addEventListener('submit', (e) => { e.preventDefault(); if (onOk(form) !== false) closeModal(); });
}
function closeModal() {
  $('modal').hidden = true; $('modal').textContent = '';
  if (modalBack?.isConnected) modalBack.focus();
}
$('modal').addEventListener('click', (e) => { if (e.target === e.currentTarget || e.target.closest('[data-m=no]')) closeModal(); });
$('modal').addEventListener('keydown', (e) => {
  if (e.key !== 'Tab') return; // 초점이 창 밖으로 나가지 않게
  const f = [...$('modal').querySelectorAll('input,textarea,select,button')].filter((x) => !x.disabled);
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
addEventListener('keydown', (e) => {
  if (!$('modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
  if (sideOpen) { if (e.key === 'Escape') setSide(false); return; } // 서랍이 맨 위 층
  if (chat.open && e.key === 'Escape') { setChat(false); return; } // 챗봇 창부터 닫는다
  if (chat.open && $('chatPanel').contains(e.target)) return; // 챗봇 안의 ←/→는 글쓰기
  if (e.key === 'Escape' && narrow.matches && $('periodBtn').getAttribute('aria-expanded') === 'true') { setPeriodOpen(false); $('periodBtn').focus({ preventScroll: true }); return; }
  if (!S.detail) return;
  if (e.key === 'Escape') closeDetail();
  else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && !e.target.closest?.('input,textarea,select')) {
    e.preventDefault(); stepDetail(e.key === 'ArrowLeft' ? -1 : 1);
  }
});

const planetOptions = (cur) => planets.map((p) => `<option value="${p.id}"${p.id === cur ? ' selected' : ''}>${esc(p.name)}</option>`).join('');
function openLog() {
  modal({
    title: '별 띄우기', ok: '별 띄우기',
    fields:
      '<label class="fld"><span class="lbl">제목</span><input type="text" name="title" maxlength="60" autocomplete="off" placeholder="비워 두면 메모 첫 줄을 써요"></label>' +
      '<label class="fld"><span class="lbl">메모</span><textarea name="memo" rows="3" placeholder="이 별에 남길 말"></textarea></label>' +
      `<label class="fld"><span class="lbl">행성</span><select name="planet">${planetOptions(S.planet === 'all' ? 'p7' : S.planet)}</select></label>`,
    onOk(f) {
      const memo = f.memo.value.trim();
      const title = f.title.value.trim() || memo.split('\n')[0].slice(0, 40);
      if (!title) { toast('제목이나 메모를 적어 주세요'); return false; }
      stars.push({ id: `s${++seq}`, title, kind: 'text', size: `${[...memo].length}자`, planet: f.planet.value, fav: false, memo, notes: [], at: new Date() });
      render(); toast('별을 띄웠어요');
    },
  });
}
function openNewPlanet() {
  modal({
    title: '새 행성 만들기', ok: '만들기',
    fields:
      '<label class="fld"><span class="lbl">이름</span><input type="text" name="name" maxlength="20" autocomplete="off" placeholder="예: 운동 기록"></label>' +
      `<div class="fld"><span class="lbl">색</span><div class="sws">${COLORS.map((c, i) => `<label><input type="radio" name="color" value="${c}"${i === planets.length % COLORS.length ? ' checked' : ''}><span style="background:${c}"></span></label>`).join('')}</div></div>`,
    onOk(f) {
      const name = f.name.value.trim();
      if (!name) { toast('행성 이름을 적어 주세요'); return false; }
      if (planets.some((p) => p.name === name)) { toast('같은 이름의 행성이 있어요'); return false; }
      planets.push({ id: `p${++seq}`, name, color: f.color.value, color_index: COLORS.indexOf(f.color.value) + 1 });
      render(); toast(`${name} 행성을 만들었어요`);
    },
  });
}
function askDelete(ids) {
  const one = ids.length === 1 ? stars.find((s) => s.id === ids[0]) : null;
  modal({
    title: one ? '이 별을 지울까요?' : `별 ${ids.length}개를 지울까요?`,
    desc: one ? `「${one.title}」이 지워지고 되돌릴 수 없어요.` : '고른 별이 모두 지워지고 되돌릴 수 없어요.',
    ok: '지우기', kind: 'pink',
    onOk() {
      stars = stars.filter((s) => !ids.includes(s.id));
      const wasOpen = ids.includes(S.detail);
      if (wasOpen) S.detail = null;
      render(); if (wasOpen) scrollTo({ top: backY }); toast(one ? '별을 지웠어요' : `별 ${ids.length}개를 지웠어요`);
    },
  });
}

/* ================= 흉내 챗봇(대화 하나) =================
   답 데이터(CHAT)와 고르는 규칙(answerFor)은 data.js에 있다: 3D 우주의 챗봇도 같은 답을 낸다. */
const CHAT = T.chat;

const chat = { open: false, msgs: [] }; // msgs: { role: 'user'|'bot'|'wait', text, sources?, savedId? }
const words = (t) => (t.toLowerCase().match(/[\p{L}\p{N}]{2,}/gu) ?? []);

const answerFor = (q) => T.answerFor(q, { planets, stars });

function quickHtml() {
  return `<div class="cp-quick">${CHAT.quick.map((q, i) => `<button type="button" class="btn ghost" data-q="${i}">${esc(q)}</button>`).join('')}</div>`;
}

function renderChat() {
  const box = $('cpMsgs');
  if (!chat.msgs.length) {
    box.innerHTML = '<li class="cp-home"><h3 class="cp-hi">무엇을 찾아 드릴까요</h3><p class="cp-sub">띄운 별에서 찾아 답해요. 답 아래에 근거가 된 별이 보여요.</p>' + quickHtml() + '</li>';
    return;
  }
  box.innerHTML = chat.msgs.map((m, i) => {
    if (m.role === 'user') return `<li class="b user"><p class="tx">${esc(m.text)}</p></li>`;
    if (m.role === 'wait') return '<li class="b bot wait"><p class="tx">별에서 찾는 중</p></li>';
    const src = m.sources.length
      ? `<div class="srcs"><p class="srclbl">근거 ${m.sources.length}개</p><ul aria-label="출처">${m.sources.map((id) => {
          const x = stars.find((y) => y.id === id);
          if (!x) return '<li><div class="src gone"><span class="pdot"></span><span class="t">지워진 별</span></div></li>';
          return `<li><button type="button" class="src" data-src="${x.id}" aria-label="별 '${esc(x.title)}' 열기"><span class="pdot" style="background:${P(x.planet)?.color}"></span><span class="t">${esc(x.title)}</span><small>${md(x.at)}</small></button></li>`;
        }).join('')}</ul></div>`
      : '';
    const saved = m.savedId && stars.some((y) => y.id === m.savedId);
    const acts = m.notFound ? quickHtml() : `<div class="bacts">${saved
      ? `<button type="button" class="btn ghost sm" data-saved="${m.savedId}">${ico('star', 14)} 띄운 별 보기 →</button>`
      : `<button type="button" class="btn ghost sm" data-save="${i}">${ico('star', 14)} 별로 저장</button>`}</div>`;
    return `<li class="b bot"><p class="tx">${esc(m.text)}</p>${src}${acts}</li>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

let askT = 0;
function askChat(q) {
  q = q.trim();
  if (!q || chat.msgs.some((m) => m.role === 'wait')) return;
  chat.msgs.push({ role: 'user', text: q }, { role: 'wait' });
  renderChat();
  clearTimeout(askT);
  askT = setTimeout(() => { // 찾는 시간처럼 보이게 잠깐 기다린다
    chat.msgs = chat.msgs.filter((m) => m.role !== 'wait');
    chat.msgs.push({ role: 'bot', q, ...answerFor(q) });
    renderChat();
  }, 700);
}

function setChat(open) {
  chat.open = open;
  document.body.classList.toggle('chat-open', open);
  $('chatPanel').hidden = !open;
  $('chatBtn').setAttribute('aria-expanded', String(open));
  $('chatBtn').setAttribute('aria-label', open ? '챗봇 닫기' : '챗봇 열기');
  $('chatBtn').querySelector('.t').textContent = open ? '닫기' : '물어보기';
  if (open) { renderChat(); $('cpInput').focus(); } else $('chatBtn').focus({ preventScroll: true });
}

$('cpClose').addEventListener('click', () => setChat(false));
$('cpReset').addEventListener('click', () => { clearTimeout(askT); chat.msgs = []; renderChat(); $('cpInput').focus(); });
$('cpForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const q = $('cpInput').value;
  $('cpInput').value = ''; $('cpGo').disabled = true;
  askChat(q);
});
$('cpInput').addEventListener('input', (e) => { $('cpGo').disabled = !e.target.value.trim(); });
$('cpInput').addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' || e.shiftKey || e.isComposing || e.keyCode === 229) return;
  e.preventDefault(); $('cpForm').requestSubmit(); // Enter = 보내기, Shift+Enter = 줄바꿈
});
$('cpMsgs').addEventListener('click', (e) => {
  const q = e.target.closest('[data-q]');
  if (q) { askChat(CHAT.quick[+q.dataset.q]); return; }
  const src = e.target.closest('[data-src]') ?? e.target.closest('[data-saved]');
  if (src) {
    const id = src.dataset.src ?? src.dataset.saved;
    if (matchMedia('(max-width:760px)').matches) setChat(false); // 좁은 화면: 창이 화면을 덮고 있으니 닫고 보여 준다
    // 지금 거르기(행성 · 기간 · 자주 찾음)에 걸려 안 보이는 별이면 거르기를 풀고 연다
    if (!ordered().some((x) => x.id === id)) Object.assign(S, { planet: 'all', period: 'all', fav: false, q: '' });
    keep.clear();
    openDetail(id);
    return;
  }
  const sv = e.target.closest('[data-save]');
  if (sv) {
    const m = chat.msgs[+sv.dataset.save];
    if (!m || m.savedId) return;
    const id = `s${++seq}`;
    stars.push({ id, title: m.q.slice(0, 40), kind: 'text', size: `${[...m.text].length}자`, planet: 'p7', fav: false, memo: '', notes: [], body: m.text, at: new Date() });
    m.savedId = id;
    render(); renderChat(); toast('답을 별로 띄웠어요');
    $('cpMsgs').querySelector(`[data-saved="${id}"]`)?.focus();
  }
});

/* ================= 우주로 들어가기: 앱의 블랙홀 전환 1~3단계(transition.js)를 이 화면의 요소로 =================
   1. 열림: 블랙홀이 커지고 고리가 빨라진다(300ms)
   2. 흡입: 화면에 보이는 요소가 가까운 것부터 버튼 쪽으로 빨려 들어간다(520ms, 30ms씩 차례로) · 배경 별이 돌며 사라진다
   3. 닫힘: 버튼 자리에서 잉크색 원이 퍼진다(300ms) → universe.html로. 그쪽은 같은 잉크 막 + 무지개 고리로 시작해
      앱의 4단계(준비) · 5단계(가운데 구멍으로 우주가 열림)가 이어진다.
   모션 줄이기: 200ms 잉크 페이드만. 우주로 가는 버튼이 블랙홀이 아니면(상단 바) 그 버튼 자리에서 같은 일이 일어난다 */
let entering = false;
const pause = (ms) => new Promise((r) => setTimeout(r, ms));
async function enterUniverse(btn) {
  if (entering) return;
  entering = true;
  if (chat.open) setChat(false);
  const veil = $('veil');
  if (reduce.matches) {
    veil.style.opacity = '0';
    veil.hidden = false;
    await veil.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 200, fill: 'forwards' }).finished;
    location.href = 'universe.html';
    return;
  }
  const br = btn.getBoundingClientRect();
  const cx = br.left + br.width / 2, cy = br.top + br.height / 2;
  // 1. 열림
  spin = 1.6;
  if (btn.id === 'enterBtn') $('bhCanvas').animate([{ transform: 'scale(1)' }, { transform: 'scale(2.5)' }], { duration: 300, easing: 'ease-in', fill: 'forwards' });
  await pause(180);
  // 2. 흡입: 화면 안에 보이는 것만, 가까운 것부터
  const picks = ['#top .logo', '#sideOpen', '#top .acts > .btn:not([hidden])', '.hero h1', '.hstats', '.hero .hint', '#side', '#searchBox:not([hidden])', '#planetBtn:not([hidden])', '#swBox:not([hidden])', '#periodBtn', '#period', '#table:not([hidden])', '#detail:not([hidden])', '#chatBtn', '#enterBtn'];
  const els = [...document.querySelectorAll(picks.join(','))]
    .filter((el) => { const r = el.getBoundingClientRect(); return r.width && r.bottom > 0 && r.top < innerHeight; })
    .map((el) => { const r = el.getBoundingClientRect(); return { el, dx: cx - (r.left + r.width / 2), dy: cy - (r.top + r.height / 2) }; })
    .sort((a, b) => Math.hypot(a.dx, a.dy) - Math.hypot(b.dx, b.dy));
  els.forEach(({ el, dx, dy }, i) =>
    el.animate(
      [{ transform: 'none', opacity: 1 }, { transform: `translate(${dx}px,${dy}px) scale(0) rotate(${i % 2 ? 30 : -30}deg)`, opacity: 0 }],
      { duration: 520, delay: i * 30, easing: 'cubic-bezier(.55,0,1,.45)', fill: 'forwards' },
    ),
  );
  const st = $('stars');
  st.style.transformOrigin = `${cx}px ${cy + scrollY}px`;
  st.animate([{ transform: 'none', opacity: 1 }, { transform: 'rotate(140deg) scale(0)', opacity: 0 }], { duration: 700, easing: 'cubic-bezier(.55,0,1,.45)', fill: 'forwards' });
  await pause(560);
  // 3. 닫힘: 잉크색 원이 퍼진다
  const D = Math.hypot(innerWidth, innerHeight) / 2 + 30;
  veil.style.clipPath = `circle(0px at ${cx}px ${cy}px)`;
  veil.hidden = false;
  await new Promise((done) => {
    const t0 = performance.now();
    (function f() {
      const k = Math.min((performance.now() - t0) / 300, 1);
      veil.style.clipPath = `circle(${k * k * D * 2.2}px at ${cx}px ${cy}px)`;
      if (k < 1) requestAnimationFrame(f); else done();
    })();
  });
  veil.style.clipPath = '';
  location.href = 'universe.html';
}

/* ================= 누르기 ================= */
document.addEventListener('click', (e) => {
  const el = e.target instanceof Element ? e.target.closest('[data-act]') : null;
  if (!el) return;
  const a = el.dataset.act;
  if (a === 'enter') enterUniverse(el);
  else if (a === 'log') openLog();
  else if (a === 'newPlanet') openNewPlanet();
  else if (a === 'logout') toast('테스트용 화면이라 로그아웃은 되지 않아요');
  else if (a === 'me') toast('테스트용 화면이라 계정 설정은 열리지 않아요');
  else if (a === 'chat') setChat(!chat.open);
  else if (a === 'resetFilter') { Object.assign(S, { planet: 'all', period: 'all' }); refilter(); }
  else if (a === 'favOff') { S.fav = false; refilter(); $('favSw').focus(); }
  else if (a === 'qAll') { Object.assign(S, { planet: 'all', period: 'all', fav: false }); refilter(); $('q').focus({ preventScroll: true }); }
  else if (a === 'qClear') clearQ();
});
/* 검색: 적는 대로 아래 목록을 거른다. ✕ · Esc로 지운다 */
function clearQ() { S.q = ''; refilter(); $('q').focus({ preventScroll: true }); }
$('q').addEventListener('input', (e) => { S.q = e.target.value; refilter(); });
$('q').addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && S.q) { e.preventDefault(); clearQ(); }
  else if (e.key === 'Enter' && !e.isComposing) e.target.blur(); // 폰: 자판을 내려 결과가 보이게
});
$('qClear').addEventListener('click', clearQ);
$('dock').addEventListener('click', (e) => {
  const b = e.target.closest('[data-planet]');
  if (!b) return;
  S.planet = b.dataset.planet; refilter();
  if (sideOpen) { setSide(false); return; } // 좁은 화면: 고르면 서랍을 닫고 목록을 보여 준다
  $('dock').querySelector('[aria-pressed="true"]')?.focus({ preventScroll: true });
});

/* ================= 좁은 화면의 왼쪽 서랍(우주의 왼쪽 패널과 같은 규칙) =================
   로고(+ 펼치기 아이콘)로 열고, 접기 아이콘 · 바깥 · Esc · 행성 고르기로 닫는다. 열린 동안 뒤쪽은 inert */
const narrow = matchMedia('(max-width:760px)');
let sideOpen = false;
let sideOpener = null; // 서랍을 연 버튼(로고 옆 아이콘 · 행성 버튼). 닫으면 초점을 거기로 돌린다
function setSide(open, { focus = true } = {}) {
  if (open) sideOpener = document.activeElement?.closest?.('#sideOpen,#planetBtn') ?? $('sideOpen');
  $('planetBtn').setAttribute('aria-expanded', String(open));
  sideOpen = open;
  document.body.classList.toggle('side-open', open);
  $('sideScrim').hidden = !open;
  $('sideOpen').setAttribute('aria-expanded', String(open));
  for (const el of [$('top'), document.querySelector('.hero'), document.querySelector('.lay > section'), $('chatBtn'), $('chatPanel')]) el.inert = open;
  if (open) $('sideClose').focus();
  else if (focus) (sideOpener?.offsetParent ? sideOpener : $('sideOpen')).focus({ preventScroll: true });
}
$('sideOpen').addEventListener('click', () => setSide(true));
$('planetBtn').addEventListener('click', () => setSide(true));
/* 시계 버튼: 기간 바 펼치기 · 접기 */
function setPeriodOpen(open) {
  document.querySelector('.lhead').classList.toggle('p-open', open);
  $('periodBtn').setAttribute('aria-expanded', String(open));
}
$('periodBtn').addEventListener('click', () => {
  const open = $('periodBtn').getAttribute('aria-expanded') !== 'true';
  setPeriodOpen(open);
  if (open) $('pSeg').querySelector('[aria-pressed="true"]')?.focus();
});
$('sideClose').addEventListener('click', () => setSide(false));
$('sideScrim').addEventListener('click', () => setSide(false));
$('newPlanet').addEventListener('click', () => { if (sideOpen) setSide(false, { focus: false }); }, true); // 창이 서랍 뒤에 가리지 않게
narrow.addEventListener('change', () => { if (!narrow.matches && sideOpen) setSide(false, { focus: false }); });
$('side').addEventListener('keydown', (e) => { // 서랍 안에서 Tab이 돈다
  if (!sideOpen || e.key !== 'Tab') return;
  const f = [...$('side').querySelectorAll('button')].filter((x) => x.offsetParent);
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
  else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
});
$('pSeg').addEventListener('click', (e) => {
  const b = e.target.closest('[data-p]');
  if (!b) return;
  // 좁은 화면: 전체 · 오늘 · 이번 주를 고르면 기간 바를 접고 시계로 초점을 돌린다(직접 지정은 날짜를 고르게 남긴다)
  if (narrow.matches && b.dataset.p !== 'custom' && $('periodBtn').getAttribute('aria-expanded') === 'true') {
    queueMicrotask(() => { setPeriodOpen(false); $('periodBtn').focus({ preventScroll: true }); });
  }
  S.period = b.dataset.p;
  if (S.period === 'custom' && !S.from) { S.from = S.to = iso(day0(NOW)); $('rFrom').value = S.from; $('rTo').value = S.to; }
  refilter();
});
$('groupSw').addEventListener('click', () => { S.group = !S.group; refilter(); });
$('favSw').addEventListener('click', () => { S.fav = !S.fav; refilter(); });
for (const id of ['rFrom', 'rTo']) $(id).addEventListener('change', () => { S.from = $('rFrom').value; S.to = $('rTo').value; refilter(); });

$('table').addEventListener('click', (e) => {
  const a = e.target.closest('[data-a]');
  const s = stars.find((x) => x.id === e.target.closest('.row')?.dataset.id);
  if (!a || !s) return;
  if (a.dataset.a === 'open') { openDetail(s.id); $('detail').querySelector('[data-d=back]').focus({ preventScroll: true }); }
  else if (a.dataset.a === 'fav') {
    s.fav = !s.fav;
    if (S.fav && !s.fav) keep.add(s.id); else keep.delete(s.id);
    render(); $('table').querySelector(`[data-id="${s.id}"] .fav`)?.focus();
  }
});
$('detail').addEventListener('click', (e) => {
  const d = e.target.closest('[data-d]')?.dataset.d;
  if (d === 'back') closeDetail();
  else if (d === 'prev' || d === 'next') stepDetail(d === 'prev' ? -1 : 1);
  else if (d === 'openFile') toast('테스트용 화면이라 원본은 열리지 않아요');
  else if (d === 'folder') toast('테스트용 화면이라 폴더는 열리지 않아요');
  else if (d === 'noteSave') saveNote();
  else if (d === 'del') askDelete([S.detail]);
});
function saveNote() {
  const s = stars.find((x) => x.id === S.detail), box = $('detail').querySelector('[data-d=note]');
  const text = box?.value.trim();
  if (!s || !text) return;
  s.notes.push({ text, at: new Date().toISOString() });
  persist();
  renderDetail(); toast('덧붙였어요');
  $('detail').querySelector('[data-d=note]').focus();
}
$('detail').addEventListener('input', (e) => {
  const s = stars.find((x) => x.id === S.detail), d = e.target.dataset.d;
  if (!s) return;
  if (d === 'memo') { s.memo = e.target.value; persist(); } // 자동 저장: 다시 그리지 않는다(쓰던 자리가 그대로)
  else if (d === 'note') $('detail').querySelector('[data-d=noteSave]').disabled = !e.target.value.trim();
});
$('detail').addEventListener('keydown', (e) => {
  if (e.target.dataset.d !== 'note' || e.key !== 'Enter' || e.shiftKey || e.isComposing || e.keyCode === 229) return;
  e.preventDefault(); saveNote(); // Enter = 저장, Shift+Enter = 줄바꿈
});
$('detail').addEventListener('change', (e) => {
  const s = stars.find((x) => x.id === S.detail);
  if (!s || e.target.dataset.d !== 'move') return;
  s.planet = e.target.value;
  const name = P(s.planet).name;
  render();
  if (!S.detail) { scrollTo({ top: backY }); toast(`${name}(으)로 옮겼어요. 지금 보는 목록에서는 빠졌어요`); }
  else { toast(`${name}(으)로 옮겼어요`); $('detail').querySelector('[data-d=move]').focus(); }
});


/* ================= 상단 바: 스크롤하면 배경이 생기고, 블랙홀이 사라지면 "우주로 들어가기"가 나타난다 ================= */
const topBar = $('top');
const syncTop = () => {
  topBar.classList.toggle('stuck', scrollY > 8);
  document.documentElement.style.setProperty('--top-h', `${topBar.offsetHeight}px`);
};
addEventListener('scroll', syncTop, { passive: true });
addEventListener('resize', syncTop);
new IntersectionObserver(([en]) => { $('topEnter').hidden = en.isIntersecting; syncTop(); }, { rootMargin: '-70px 0px 0px 0px' }).observe($('enterBtn'));

/* ================= 블랙홀 엠블럼(앱의 home.js drawBH와 같은 그림) · 배경 별 ================= */
const reduce = matchMedia('(prefers-reduced-motion: reduce)');
let rot = 0, last = 0, spin = 0.22; // spin: 평소 0.22, 들어갈 때 1.6(앱과 같다)
function drawBH(now) {
  const c = $('bhCanvas'), w = c.clientWidth;
  const dt = last ? Math.min((now - last) / 1000, 0.05) : 0;
  last = now; rot += dt * spin * (reduce.matches ? 0.15 : 1);
  if (w > 0 && !document.hidden) {
    const dpr = Math.min(devicePixelRatio, 2), px = Math.round(w * dpr);
    if (c.width !== px) c.width = c.height = px;
    const g = c.getContext('2d'), m = w / 2, k = w / 300;
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, w, w);
    const glow = g.createRadialGradient(m, m, 40 * k, m, m, 150 * k);
    glow.addColorStop(0, 'rgba(122,108,255,.55)'); glow.addColorStop(1, 'rgba(122,108,255,0)');
    g.fillStyle = glow; g.fillRect(0, 0, w, w); g.lineCap = 'round';
    [[128, '#7a6cff', 0.7, 2.2], [108, '#ff5d8f', 1, 1.7], [88, '#ffd23f', 1.5, 2.6]].forEach(([r, col, sp, len], i) => {
      for (let j = 0; j < 2; j++) {
        const a = rot * sp + i * 1.3 + j * Math.PI;
        g.beginPath(); g.arc(m, m, r * k, a, a + len); g.strokeStyle = '#1a1430'; g.lineWidth = 17 * k; g.stroke();
        g.beginPath(); g.arc(m, m, r * k, a, a + len); g.strokeStyle = col; g.lineWidth = 10 * k; g.stroke();
      }
    });
    g.beginPath(); g.arc(m, m, 66 * k, 0, 6.3); g.fillStyle = '#0c0820'; g.fill(); g.lineWidth = 5 * k; g.strokeStyle = '#1a1430'; g.stroke();
  }
  requestAnimationFrame(drawBH);
}
requestAnimationFrame(drawBH);
(() => {
  const box = $('stars'), cols = ['#fff', '#ffe9a8', '#bfe3ff', '#ffc2dc'], r = (a, b) => a + Math.random() * (b - a);
  for (let i = 0; i < 110; i++) {
    const d = document.createElement('i'), s = r(1.5, 3.5);
    d.style.cssText = `left:${r(0, 100)}%;top:${r(0, 100)}%;width:${s}px;height:${s}px;background:${cols[i % 4]}`;
    box.appendChild(d);
  }
})();

render();
syncTop();
</script>
</body>
</html>
