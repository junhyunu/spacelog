<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>spaceLog</title>
<link rel="icon" href="data:,">
</head>
<body>

<div id="stage"></div>

<div id="veil" hidden><div class="ring"></div></div>

<section id="home" aria-label="메인 홈">
  <div class="home-stars" aria-hidden="true"></div>
  <div class="home-wrap">
    <header class="home-top">
      <div class="logo card" data-suck>space<span>Log</span></div>
      <button type="button" class="btn" id="hLog" data-suck><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg> 기록하기</button>
    </header>
    <div class="hero">
      <h2 id="hGreet" data-suck></h2>
      <div class="hstats" id="hStats" data-suck></div>
      <div class="bh-wrap"><canvas id="bhCanvas" aria-hidden="true"></canvas><button type="button" class="btn violet" id="enterBtn">우주로 들어가기</button></div>
      <p class="hint" data-suck>버튼을 누르면 블랙홀을 지나 내 우주로 들어가요</p>
    </div>
    <div class="home-grid">
      <article class="card hcard" id="hRedis" data-suck></article>
      <article class="card hcard" data-suck><div class="eyebrow">행성으로 바로 들어가기</div><div class="hlist" id="hPlanets"></div></article>
      <article class="card hcard" data-suck><div class="eyebrow">최근 별</div><div class="hlist" id="hRecent"></div></article>
    </div>
    <article class="card hcard" id="hState" hidden></article>
  </div>
</section>

<div id="brand" class="card" hidden>
  <h1>space<span>Log</span></h1>
  <div class="stats"><span>이 기간</span><b id="sRec">0</b>개의 별 <b id="sPlanet">0</b>개의 행성</div>
  <div class="brow"><button type="button" class="btn ghost" id="goHome">← 홈</button></div>
</div>

<div id="period" class="card" hidden>
  <div class="seg" role="group" aria-label="기간 선택"><button type="button" data-p="today">오늘</button><button type="button" data-p="week">이번 주</button><button type="button" data-p="custom">직접 지정</button></div>
  <div class="range" id="range" hidden><input type="date" id="rFrom" aria-label="시작 날짜"><span>~</span><input type="date" id="rTo" aria-label="끝 날짜"></div>
  <div id="wBanner" class="banner" role="status" hidden></div>
</div>

<div id="help" class="card big" hidden>
  <b class="ht">처음이라면, 이렇게 날아요</b>
  <div class="keys"><span><kbd>WASD</kbd>비행</span><span><kbd>Space</kbd><kbd>Shift</kbd>상승·하강</span><span><kbd>드래그</kbd>시점</span><span><kbd>E</kbd>착륙</span></div>
</div>

<div id="dock" class="dock" hidden><div class="label">행성으로 바로 날아가기</div></div>

<button type="button" id="near" class="btn" hidden></button>

<div id="redis" class="card" hidden></div>

<button type="button" id="wLog" class="btn" hidden><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg> 기록하기</button>

<div id="worldMsg" class="card" hidden></div>

<aside id="panel" class="card" hidden aria-live="polite"></aside>

<div id="dropveil" aria-hidden="true" hidden>
  <div class="card"><svg class="i" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg><b>여기에 놓으면 별이 돼요</b></div>
</div>

<div id="save" hidden>
  <form class="card" id="svForm" role="dialog" aria-modal="true" aria-labelledby="svHead" novalidate>
    <header>
      <h3 id="svHead">별 띄우기</h3>
      <div class="tabs" id="svTabs" role="tablist" aria-label="기록 종류">
        <button type="button" role="tab" id="svTabText" data-tab="text" aria-controls="svPaneText" aria-selected="true">글</button>
        <button type="button" role="tab" id="svTabLink" data-tab="link" aria-controls="svPaneLink" aria-selected="false" tabindex="-1">링크</button>
        <button type="button" role="tab" id="svTabFile" data-tab="file" aria-controls="svPaneFile" aria-selected="false" tabindex="-1">파일</button>
      </div>
      <button type="button" class="btn x ghost" id="svX" aria-label="닫기"><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </header>
    <div class="body" id="svBodyWrap">
      <div class="pane" id="svPaneText" role="tabpanel" aria-labelledby="svTabText">
        <label class="fld"><span class="lbl">글</span><textarea id="svText" rows="6" placeholder="남기고 싶은 글을 적어 주세요"></textarea></label>
      </div>
      <div class="pane" id="svPaneLink" role="tabpanel" aria-labelledby="svTabLink" hidden>
        <label class="fld"><span class="lbl">주소</span><input type="text" id="svUrl" class="mono" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://" aria-describedby="svUrlErr"></label>
        <p class="err" id="svUrlErr" hidden></p>
      </div>
      <div class="pane" id="svPaneFile" role="tabpanel" aria-labelledby="svTabFile" hidden>
        <div class="drop" id="svDrop"><span>파일을 여기에 놓거나</span><button type="button" class="btn ghost" id="svPick">파일 고르기</button><input type="file" id="svFile" multiple hidden tabindex="-1" aria-hidden="true"></div>
        <ul class="files" id="svFiles" aria-label="담긴 파일" hidden></ul>
      </div>
      <label class="fld" id="svTitleFld"><span class="lbl">제목</span><input type="text" id="svTitle" maxlength="200" autocomplete="off"></label>
      <div class="fld">
        <label class="lbl" for="svPlanet">행성</label>
        <div class="psel"><span class="dot" id="svDot" aria-hidden="true"></span><select id="svPlanet"></select></div>
        <input type="text" id="svNewName" autocomplete="off" placeholder="새 행성 이름 (20자까지)" aria-label="새 행성 이름" hidden>
      </div>
      <label class="fld"><span class="lbl">메모</span><textarea id="svMemo" rows="3" maxlength="20000" placeholder="비워 둬도 돼요"></textarea></label>
    </div>
    <footer>
      <p class="err" id="svErr" role="alert" hidden></p>
      <div class="row"><button type="button" class="btn ghost" id="svNo">취소</button><button type="submit" class="btn yellow" id="svYes">별 띄우기</button></div>
    </footer>
  </form>
</div>

<div id="planetForm" hidden>
  <form class="card" id="pfForm" role="dialog" aria-modal="true" aria-labelledby="pfTitle" novalidate>
    <header><h3 id="pfTitle"></h3><button type="button" class="btn x ghost" id="pfX" aria-label="닫기"><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></header>
    <label class="fld"><span class="lbl">이름</span><input type="text" id="pfName" maxlength="20" autocomplete="off" placeholder="예: 운동 기록"></label>
    <label class="fld"><span class="lbl">한 줄 설명</span><input type="text" id="pfDesc" maxlength="20" autocomplete="off" placeholder="비워 둬도 돼요"></label>
    <div class="fld"><span class="lbl" id="pfColorLbl">색</span><div class="swatches" id="pfColors" role="radiogroup" aria-labelledby="pfColorLbl"></div></div>
    <div class="fld"><span class="lbl" id="pfDecoLbl">장식</span><div class="chips" id="pfDecos" role="radiogroup" aria-labelledby="pfDecoLbl"></div></div>
    <label class="chk"><input type="checkbox" id="pfRing"><span>고리 두르기</span></label>
    <p class="err" id="pfErr" role="alert" hidden></p>
    <div class="row"><button type="button" class="btn ghost" id="pfNo">취소</button><button type="submit" class="btn yellow" id="pfYes">만들기</button></div>
  </form>
</div>

<div id="planetDel" hidden>
  <div class="card" role="alertdialog" aria-modal="true" aria-labelledby="pdTitle" aria-describedby="pdBody">
    <h3 id="pdTitle"></h3><div id="pdBody"></div>
    <p class="err" id="pdErr" role="alert" hidden></p>
    <div class="row"><button type="button" class="btn ghost" id="pdNo">취소</button><button type="button" class="btn pink" id="pdYes">지우기</button></div>
  </div>
</div>

<div id="confirm" hidden>
  <div class="card" role="alertdialog" aria-modal="true" aria-labelledby="cTitle" aria-describedby="cBody">
    <h3 id="cTitle"></h3><p id="cBody"></p><div id="cExtra"></div>
    <div class="row"><button type="button" class="btn ghost" id="cNo">취소</button><button type="button" class="btn pink" id="cYes">확인</button></div>
  </div>
</div>

<div id="toast" class="card" role="status" aria-live="polite" hidden></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
