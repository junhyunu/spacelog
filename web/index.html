<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>spaceLog</title>
<link rel="icon" href="data:,">
</head>
<body>

<div id="stage"></div>

<div id="veil" hidden><div class="ring"></div></div>

<section id="home" aria-label="메인 홈">
  <div class="home-stars" aria-hidden="true"></div>
  <div class="home-wrap">
    <header class="home-top">
      <div class="logo card" data-suck>space<span>Log</span></div>
      <div class="home-acts">
      <button type="button" class="btn ghost" id="hCharacter" data-suck><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg> 캐릭터</button>
      <button type="button" class="btn" id="hLog" data-suck><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg> 기록하기</button>
      </div>
    </header>
    <div class="hero">
      <h2 id="hGreet" data-suck></h2>
      <div class="hstats" id="hStats" data-suck></div>
      <div class="bh-wrap"><canvas id="bhCanvas" aria-hidden="true"></canvas><button type="button" class="btn violet" id="enterBtn">우주로 들어가기</button></div>
      <p class="hint" data-suck>버튼을 누르면 블랙홀을 지나 내 우주로 들어가요</p>
    </div>
    <div class="home-grid">
      <article class="card hcard" id="hRedis" data-suck></article>
      <article class="card hcard" data-suck><div class="eyebrow">행성으로 바로 들어가기</div><div class="hlist" id="hPlanets"></div></article>
      <article class="card hcard" data-suck><div class="eyebrow">최근 별</div><div class="hlist" id="hRecent"></div></article>
    </div>
    <article class="card hcard" id="hState" hidden></article>
  </div>
</section>

<!-- W-01 왼쪽 패널(스펙 6-8): 로고 · 요약 · 바로 날아가기 목록 · 조작 안내. 접으면 #sideOpen만 남는다 -->
<div id="left" hidden>
  <button type="button" id="sideOpen" class="card" aria-label="spaceLog 왼쪽 패널 펼치기" aria-expanded="false" aria-controls="side" hidden><span class="logo" aria-hidden="true">space<span>Log</span></span><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/></svg></button>
  <div id="sideScrim" hidden></div>
  <aside id="side" class="card" aria-label="우주 안내">
    <header class="sd-head">
      <h1>space<span>Log</span></h1>
      <button type="button" class="btn ghost x" id="sideClose" aria-label="왼쪽 패널 접기" aria-expanded="true" aria-controls="side"><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg></button>
    </header>
    <div class="sd-sum">
      <div class="stats">이 기간 별<b id="sRec">0</b>개 · 행성<b id="sPlanet">0</b>개</div>
      <button type="button" class="btn ghost" id="goHome"><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> 홈</button>
      <button type="button" class="btn ghost" id="wCharacter"><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg> 캐릭터 꾸미기</button>
    </div>
    <div class="sd-planets">
      <div class="label" id="dockLabel">행성으로 바로 날아가기</div>
      <button type="button" id="wNewPlanet" data-act="newPlanet"><span class="dot" aria-hidden="true"><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></span><span class="t">새 행성</span></button>
      <div id="dock" class="dock" role="group" aria-labelledby="dockLabel"></div>
    </div>
    <div id="help" class="big">
      <button type="button" id="helpToggle" aria-expanded="true" aria-controls="helpKeys"><b class="ht">처음이라면, 이렇게 날아요</b><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="keys" id="helpKeys"><span><kbd>WASD</kbd>비행</span><span><kbd>Space</kbd><kbd>Shift</kbd>상승·하강</span><span><kbd>드래그</kbd>시점</span><span><kbd>E</kbd>착륙</span></div>
    </div>
  </aside>
</div>

<!-- 기간 바(오른쪽 위) + 별 상한 띠 배너(바로 아래) -->
<div id="period" hidden>
  <div class="pbar card">
    <div class="seg" role="group" aria-label="기간 선택"><button type="button" data-p="today">오늘</button><button type="button" data-p="week">이번 주</button><button type="button" data-p="custom">직접 지정</button></div>
    <div class="range" id="range" hidden><input type="date" id="rFrom" aria-label="시작 날짜"><span>~</span><input type="date" id="rTo" aria-label="끝 날짜"></div>
  </div>
  <div id="wBanner" class="banner" role="status" hidden></div>
</div>

<button type="button" id="near" class="btn" hidden></button>

<div id="redis" class="card" hidden></div>

<!-- 빈 우주 말풍선: 기록하기 바로 위, 꼬리가 아래로 버튼을 가리킨다 -->
<div id="wHint" class="card" role="note" aria-labelledby="wHintTitle" hidden><p><b id="wHintTitle"></b><span id="wHintBody"></span></p><button type="button" class="btn ghost x" id="wHintX" aria-label="안내 닫기"><svg class="i" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>

<button type="button" id="wLog" class="btn" hidden><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg> 기록하기</button>

<div id="worldMsg" class="card" hidden></div>

<aside id="panel" class="card" hidden aria-live="polite"></aside>

<div id="dropveil" aria-hidden="true" hidden>
  <div class="card"><svg class="i" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg><b>여기에 놓으면 별이 돼요</b></div>
</div>

<!-- 기록하기 창(스펙 6-9): 글 + 첨부 파일 + 링크 → 별 하나. 아이콘은 saveModal.js가 채운다 -->
<div id="save" hidden>
  <form class="card" id="svForm" role="dialog" aria-modal="true" aria-labelledby="svHead" novalidate>
    <header>
      <h3 id="svHead">별 띄우기</h3>
      <button type="button" class="btn x ghost" id="svX" aria-label="닫기"><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </header>
    <div class="body" id="svBodyWrap">
      <textarea id="svText" rows="6" placeholder="무엇이든 남겨 보세요" aria-label="글"></textarea>
      <div class="tools" role="group" aria-label="첨부 더하기">
        <button type="button" class="btn ghost sm" id="svAttach" title="파일 첨부"><span id="svAttachIco"></span>파일 첨부</button>
        <button type="button" class="btn ghost sm" id="svLinkBtn" title="링크 붙이기" aria-expanded="false" aria-controls="svLinkRow"><span id="svLinkIco"></span>링크 붙이기</button>
        <span class="cnt" id="svCount" aria-live="polite"></span>
        <input type="file" id="svFile" multiple hidden tabindex="-1" aria-hidden="true">
      </div>
      <div class="linkrow" id="svLinkRow" hidden>
        <input type="text" id="svUrl" class="mono" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://" aria-label="링크 주소" aria-describedby="svUrlErr">
        <button type="button" class="btn sm" id="svUrlAdd">붙이기</button>
      </div>
      <p class="err" id="svUrlErr" hidden></p>
      <ul class="chips" id="svChips" aria-label="담긴 첨부" hidden></ul>
      <label class="fld"><span class="lbl">제목</span><input type="text" id="svTitle" maxlength="200" autocomplete="off" placeholder="비워 두면 글의 첫 줄을 써요"></label>
      <div class="fld">
        <label class="lbl" for="svPlanet">행성</label>
        <div class="psel"><span class="dot" id="svDot" aria-hidden="true"></span><select id="svPlanet"></select></div>
        <input type="text" id="svNewName" autocomplete="off" placeholder="새 행성 이름 (20자까지)" aria-label="새 행성 이름" hidden>
      </div>
    </div>
    <footer>
      <p class="err" id="svErr" role="alert" hidden></p>
      <div class="row"><button type="button" class="btn ghost" id="svNo">취소</button><button type="submit" class="btn yellow" id="svYes">별 띄우기</button></div>
    </footer>
  </form>
</div>

<div id="planetForm" hidden>
  <form class="card" id="pfForm" role="dialog" aria-modal="true" aria-labelledby="pfTitle" novalidate>
    <header><h3 id="pfTitle"></h3><button type="button" class="btn x ghost" id="pfX" aria-label="닫기"><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></header>
    <label class="fld"><span class="lbl">이름</span><input type="text" id="pfName" maxlength="20" autocomplete="off" placeholder="예: 운동 기록"></label>
    <label class="fld"><span class="lbl">한 줄 설명</span><input type="text" id="pfDesc" maxlength="20" autocomplete="off" placeholder="비워 둬도 돼요"></label>
    <div class="fld"><span class="lbl" id="pfColorLbl">색</span><div class="swatches" id="pfColors" role="radiogroup" aria-labelledby="pfColorLbl"></div></div>
    <div class="fld"><span class="lbl" id="pfDecoLbl">장식</span><div class="chips" id="pfDecos" role="radiogroup" aria-labelledby="pfDecoLbl"></div></div>
    <label class="chk"><input type="checkbox" id="pfRing"><span>고리 두르기</span></label>
    <p class="err" id="pfErr" role="alert" hidden></p>
    <div class="row"><button type="button" class="btn ghost" id="pfNo">취소</button><button type="submit" class="btn yellow" id="pfYes">만들기</button></div>
  </form>
</div>

<!-- 캐릭터 꾸미기 창(스펙 6-10): 미리보기 캔버스 · 칩 · 색 원은 characterForm.js가 채운다 -->
<div id="charForm" hidden>
  <form class="card" id="cfForm" role="dialog" aria-modal="true" aria-labelledby="cfTitle" novalidate>
    <header><h3 id="cfTitle">캐릭터 꾸미기</h3><button type="button" class="btn x ghost" id="cfX" aria-label="닫기"><svg class="i" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></header>
    <div class="preview" id="cfPreview" role="img" aria-label="미리보기" tabindex="0" aria-describedby="cfPreviewHint"></div>
    <p class="hint" id="cfPreviewHint">끌어서 돌려 보세요</p>
    <div class="fld"><span class="lbl" id="cfKindLbl">종류</span><div class="chips" id="cfKinds" role="radiogroup" aria-labelledby="cfKindLbl"></div></div>
    <div class="fld"><span class="lbl" id="cfSuitLbl">몸 색</span><div class="swatches" id="cfSuits" role="radiogroup" aria-labelledby="cfSuitLbl"></div></div>
    <div class="fld"><span class="lbl" id="cfAccentLbl">포인트 색</span><div class="swatches" id="cfAccents" role="radiogroup" aria-labelledby="cfAccentLbl"></div></div>
    <div class="fld"><span class="lbl" id="cfFlameLbl">불꽃</span><div class="chips" id="cfFlames" role="radiogroup" aria-labelledby="cfFlameLbl"></div></div>
    <p class="err" id="cfErr" role="alert" hidden></p>
    <div class="row"><button type="button" class="btn ghost" id="cfNo">취소</button><button type="submit" class="btn yellow" id="cfYes">저장하기</button></div>
  </form>
</div>

<div id="planetDel" hidden>
  <div class="card" role="alertdialog" aria-modal="true" aria-labelledby="pdTitle" aria-describedby="pdBody">
    <h3 id="pdTitle"></h3><div id="pdBody"></div>
    <p class="err" id="pdErr" role="alert" hidden></p>
    <div class="row"><button type="button" class="btn ghost" id="pdNo">취소</button><button type="button" class="btn pink" id="pdYes">지우기</button></div>
  </div>
</div>

<div id="confirm" hidden>
  <div class="card" role="alertdialog" aria-modal="true" aria-labelledby="cTitle" aria-describedby="cBody">
    <h3 id="cTitle"></h3><p id="cBody"></p><div id="cExtra"></div>
    <div class="row"><button type="button" class="btn ghost" id="cNo">취소</button><button type="button" class="btn pink" id="cYes">확인</button></div>
  </div>
</div>

<div id="toast" class="card" role="status" aria-live="polite" hidden></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
